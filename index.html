<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#6cc4ef"/>
<title>YETZI — Got Yeeted. Landed on Arc.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   YETZI — Got Yeeted. Landed on Arc.
   Single-file stylesheet (shared by the React app and the
   standalone preview). Palette + type are derived from the
   artwork: icy whites, cyan water, royal-blue fur, Arc navy.
   ============================================================ */

:root {
  /* Palette pulled from the artwork */
  --ice:        #eaf5fc;
  --ice-2:      #cfe9f8;
  --water:      #6cc4ef;
  --water-deep: #2f8fd8;
  --royal:      #1b54e0;   /* YETZI fur / primary accent  */
  --royal-2:    #2f7ff0;
  --navy:       #12305e;   /* Arc outline / text ink      */
  --navy-soft:  #274a80;
  --sakura:     #f3a7c7;
  --wood:       #c9963f;
  --white:      #ffffff;

  --ar: 2.5006;            /* artwork aspect ratio (1983/793) */

  --shadow-soft: 0 10px 30px rgba(18, 48, 94, .18);
  --shadow-pop:  0 6px 0 rgba(18, 48, 94, .22);

  --font-display: "Luckiest Guy", system-ui, sans-serif;
  --font-body: "Fredoka", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }

html, body, #root {
  height: 100%;
  margin: 0;
}

body {
  font-family: var(--font-body);
  background: var(--ice);
  color: var(--navy);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Stage / scene (the living artwork) ---------- */

.app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: radial-gradient(120% 120% at 50% 30%, var(--ice) 0%, var(--ice-2) 100%);
}

/* The scene keeps the artwork's aspect ratio and always covers
   the viewport, centred on YETZI. All animated pieces live inside
   it and are positioned as % of the artwork, so the monkey always
   sits exactly over its inpainted spot no matter the screen size. */
.scene {
  position: absolute;
  top: 50%;
  left: 50%;
  /* Center the artwork, then nudge so the chosen focal point
     (--fx,--fy) sits at the viewport centre. Defaults keep the
     composition balanced on desktop; narrow screens re-focus on
     YETZI (see media queries below). */
  --fx: 52%;
  --fy: 50%;
  transform: translate(-50%, -50%) translate(calc(50% - var(--fx)), calc(50% - var(--fy)));
  width: max(100vw, calc(100vh * var(--ar)));
  height: max(100vh, calc(100vw / var(--ar)));
}

.scene__bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  user-select: none;
  -webkit-user-drag: none;
}

.layer {
  position: absolute;
  will-change: transform;
  pointer-events: none;
}
.layer img {
  width: 100%;
  height: auto;
  display: block;
  -webkit-user-drag: none;
}

/* Character */
.layer--character {
  left: var(--char-left, 30.812%);
  top:  var(--char-top, 2.648%);
  width: var(--char-width, 48.815%);
  transform-origin: 52% 60%;
  filter: drop-shadow(0 18px 22px rgba(20, 70, 130, .22));
  animation: floatChar 6s ease-in-out infinite;
}

/* Drifting steam / ice puffs */
.layer--ice { opacity: .96; }
.layer--ice1 {
  left: 51.336%; top: 5.044%; width: 4.539%;
  animation: drift1 9s ease-in-out infinite;
}
.layer--ice2 {
  left: 28.543%; top: 50.189%; width: 7.363%;
  animation: drift2 11s ease-in-out infinite;
  animation-delay: -2.5s;
}

@keyframes floatChar {
  0%,100% { transform: translateY(-0.45vh) rotate(-1.3deg) scale(1); }
  50%     { transform: translateY(1.15vh)  rotate(1.5deg)  scale(1.014); }
}
@keyframes drift1 {
  0%,100% { transform: translate(0,0) rotate(0deg); }
  50%     { transform: translate(0.7vw, -1.2vh) rotate(4deg); }
}
@keyframes drift2 {
  0%,100% { transform: translate(0,0) rotate(0deg); }
  50%     { transform: translate(-0.9vw, 1.1vh) rotate(-5deg); }
}

/* Sakura petals falling from the branch (pure CSS confetti of blossoms) */
.petals { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.petal {
  position: absolute;
  top: -6%;
  width: calc(14px * var(--scale, 1));
  height: calc(12px * var(--scale, 1));
  background: radial-gradient(closest-side at 50% 40%, #fff 0 8%, var(--sakura) 40%, #e98cb4 100%);
  border-radius: 60% 60% 60% 60% / 70% 70% 40% 40%;
  opacity: .9;
  animation: petalFall linear infinite;
}
.petal::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(255,255,255,.5), transparent 60%);
  border-radius: inherit;
}
@keyframes petalFall {
  0%   { transform: translate(0, -10vh) rotate(0deg);   opacity: 0; }
  10%  { opacity: .95; }
  100% { transform: translate(calc(var(--sway, 12vw) * -1), 112vh) rotate(420deg); opacity: .9; }
}

/* Legibility veils — static, do NOT touch the artwork itself */
.veil {
  position: absolute; left: 0; right: 0; pointer-events: none; z-index: 2;
}
.veil--top {
  top: 0; height: 26%;
  background: linear-gradient(180deg, rgba(234,245,252,.85), rgba(234,245,252,0));
}
.veil--bottom {
  bottom: 0; height: 42%;
  background: linear-gradient(0deg, rgba(224,240,251,.9), rgba(224,240,251,0));
}

/* ---------- UI overlay ---------- */

.ui {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: clamp(16px, 3.2vh, 40px) 16px clamp(18px, 3vh, 36px);
  text-align: center;
}

.ui__top {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

/* Logo wordmark */
.logo {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  color: var(--white);
  line-height: .9;
  letter-spacing: 2px;
  font-size: clamp(46px, 11vw, 132px);
  transform: rotate(-2deg);
  -webkit-text-stroke: clamp(3px, .7vw, 7px) var(--navy);
  paint-order: stroke fill;
  text-shadow:
     0 clamp(4px,.9vw,9px) 0 var(--royal),
     0 clamp(7px,1.5vw,15px) 0 var(--navy),
     0 18px 26px rgba(18,48,94,.35);
  animation: dropIn .8s cubic-bezier(.2,1.3,.35,1) both;
  user-select: none;
}
.logo .tld { color: #ffe27a; }

@keyframes dropIn {
  0%   { opacity: 0; transform: translateY(-60px) rotate(-2deg) scale(.9); }
  60%  { opacity: 1; }
  100% { opacity: 1; transform: translateY(0) rotate(-2deg) scale(1); }
}

/* Speech bubble */
.bubble {
  position: relative;
  margin-top: clamp(10px, 2.4vh, 26px);
  max-width: min(80vw, 440px);
  background: var(--white);
  color: var(--navy);
  border: clamp(3px,.55vw,5px) solid var(--navy);
  border-radius: 26px;
  padding: clamp(12px,1.7vh,20px) clamp(18px,2.4vw,30px);
  font-family: var(--font-display);
  font-size: clamp(16px, 2.6vw, 30px);
  line-height: 1.12;
  letter-spacing: .3px;
  box-shadow: 0 10px 0 rgba(18,48,94,.16), var(--shadow-soft);
  transform: rotate(-1.5deg);
  animation: popIn .7s .25s cubic-bezier(.2,1.4,.4,1) both, bob 4.5s 1s ease-in-out infinite;
}
.bubble b { color: var(--royal); }
/* tail pointing down toward YETZI */
.bubble::after {
  content: "";
  position: absolute;
  right: 20%; bottom: -26px;
  border-width: 28px 20px 0 0;
  border-style: solid;
  border-color: var(--navy) transparent transparent transparent;
  filter: drop-shadow(0 6px 0 rgba(18,48,94,.10));
}
.bubble::before {
  content: "";
  position: absolute;
  right: calc(20% + 4px); bottom: -17px;
  border-width: 20px 14px 0 0;
  border-style: solid;
  border-color: var(--white) transparent transparent transparent;
  z-index: 1;
}
@keyframes popIn {
  0%   { opacity: 0; transform: rotate(-1.5deg) scale(.7); }
  100% { opacity: 1; transform: rotate(-1.5deg) scale(1); }
}
@keyframes bob {
  0%,100% { translate: 0 0; }
  50%     { translate: 0 -7px; }
}

/* Bottom info cluster — laid directly over the artwork (no card) */
.panel {
  width: min(560px, 92vw);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(10px, 1.6vh, 16px);
  padding: clamp(14px,2vh,22px) clamp(16px,3vw,26px);
  animation: riseIn .7s .35s ease both;
}
@keyframes riseIn {
  0% { opacity: 0; transform: translateY(24px); }
  100% { opacity: 1; transform: translateY(0); }
}

.name {
  display: inline-flex;
  align-items: baseline;
  gap: .4ch;
  font-family: var(--font-display);
  color: var(--navy);
  font-size: clamp(22px, 4vw, 34px);
  letter-spacing: 1px;
  line-height: 1;
}
.name .tick {
  font-size: .62em;
  color: var(--royal);
  background: #fff;
  border: 2px solid var(--royal);
  border-radius: 999px;
  padding: .18em .5em;
  transform: translateY(-.12em);
}
.tagline {
  margin: -2px 0 2px;
  font-size: clamp(13px, 2.1vw, 16px);
  color: var(--navy-soft);
  font-weight: 500;
}

/* Contract address row */
.contract {
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 100%;
  padding: 8px 8px 8px 14px;
  background: rgba(255,255,255,.85);
  border: 2px solid rgba(18,48,94,.14);
  border-radius: 999px;
}
.contract__label {
  font-size: 11px; font-weight: 600; letter-spacing: .12em;
  text-transform: uppercase; color: var(--navy-soft);
}
.contract__addr {
  font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
  font-size: clamp(11px, 2.1vw, 14px);
  color: var(--navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: min(46vw, 260px);
}
.copy-btn {
  flex: none;
  display: inline-grid; place-items: center;
  width: 34px; height: 34px;
  border: none; border-radius: 50%;
  background: var(--royal);
  color: #fff; cursor: pointer;
  transition: transform .12s ease, background .2s ease;
  position: relative;
}
.copy-btn:hover { background: var(--royal-2); transform: translateY(-1px) scale(1.05); }
.copy-btn:active { transform: scale(.94); }
.copy-btn svg { width: 16px; height: 16px; }
.copy-btn .tip {
  position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%) translateY(4px);
  background: var(--navy); color: #fff;
  font-family: var(--font-body); font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 8px; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
}
.copy-btn.copied .tip { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Buy button */
.buy {
  display: inline-flex; align-items: center; gap: .5ch;
  font-family: var(--font-display);
  font-size: clamp(20px, 3.4vw, 30px);
  letter-spacing: 1px;
  color: #fff;
  text-decoration: none;
  padding: clamp(12px,1.7vh,16px) clamp(26px,5vw,44px);
  border: 4px solid #fff;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--royal-2), var(--royal));
  box-shadow: 0 8px 0 var(--navy), 0 16px 26px rgba(27,84,224,.4);
  transition: transform .12s ease, box-shadow .12s ease, filter .2s ease;
  transform: translateZ(0);
}
.buy:hover { filter: brightness(1.06); transform: translateY(-2px); box-shadow: 0 10px 0 var(--navy), 0 20px 30px rgba(27,84,224,.45); }
.buy:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--navy), 0 8px 14px rgba(27,84,224,.4); }
.buy svg { width: 1em; height: 1em; }

/* Social links */
.socials {
  display: flex; gap: clamp(10px, 2.4vw, 16px);
}
.social {
  display: inline-grid; place-items: center;
  width: clamp(42px, 9vw, 52px);
  height: clamp(42px, 9vw, 52px);
  border-radius: 50%;
  color: var(--navy);
  background: rgba(255,255,255,.9);
  border: 2px solid rgba(18,48,94,.14);
  box-shadow: 0 5px 0 rgba(18,48,94,.14);
  transition: transform .14s ease, background .2s ease, color .2s ease, box-shadow .14s ease;
}
.social:hover {
  transform: translateY(-3px) scale(1.06);
  background: var(--royal);
  color: #fff;
  box-shadow: 0 8px 0 rgba(18,48,94,.2);
}
.social:active { transform: translateY(1px) scale(.98); box-shadow: 0 3px 0 rgba(18,48,94,.2); }
.social svg { width: 46%; height: 46%; }

/* Shared visible focus for keyboard users */
.buy:focus-visible,
.social:focus-visible,
.copy-btn:focus-visible {
  outline: 4px solid #ffe27a;
  outline-offset: 3px;
}

/* ---------- Responsive tuning ---------- */
@media (max-width: 900px) {
  .scene { --fx: 57%; --fy: 46%; }
}
@media (max-width: 640px) {
  .scene { --fx: 61%; --fy: 41%; }
  .bubble { max-width: 88vw; }
  .bubble::after { right: 42%; }
  .bubble::before { right: calc(42% + 4px); }
  .contract__addr { max-width: 44vw; }
  .ui { justify-content: space-between; padding-top: 14px; }
}
@media (max-height: 560px) {
  .bubble { display: none; }        /* keep it breathing on short landscape */
  .panel { gap: 8px; }
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  .layer--character,
  .layer--ice1,
  .layer--ice2,
  .petal { animation: none !important; }
  .layer--character { transform: none; }
  .petals { display: none; }
  .logo, .bubble, .panel { animation: none !important; }
}

</style>
</head>
